name: Snora
options:
  bundleIdPrefix: com.snail3d
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
settings: { base: { SWIFT_VERSION: "5.0" } }
targets:
  Snora:
    type: application
    platform: iOS
    sources: [Snora]
    info:
      path: Snora/Info.plist
      properties:
        CFBundleDisplayName: "sNora"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Take a reference photo for your video."
        NSMicrophoneUsageDescription: "Record a voice for your video."
        # cleartext HTTP over the tailnet (studio + snail-api don't serve TLS yet)
        # — documented tradeoff; revisit when the tailnet has certs
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSSpeechRecognitionUsageDescription: "Hold AI ASSIST and talk — your words become render jobs."
        NSPhotoLibraryAddUsageDescription: "Save generated photos to your photo library."
        BGTaskSchedulerPermittedIdentifiers: [com.snail3d.snora.refresh]
        UIBackgroundModes: [fetch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snail3d.snora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: YOUR_TEAM_ID  # your Apple Developer team
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
